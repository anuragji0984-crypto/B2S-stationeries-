<title>B2S Admin</title><style>
:root{--ink:#172033;--muted:#687085;--bg:#f7f8fc;--card:#fff;--p:#6c4cff;--p2:#ff4fa3;--a:#14c9a2;--shadow:0 18px 50px rgba(28,34,70,.11)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
a{text-decoration:none;color:inherit}.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-bottom:1px solid #edf0f7}.navin{max-width:1160px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;box-shadow:0 10px 25px #6c4cff40}.links{display:flex;gap:22px;font-size:14px;font-weight:700}.links a:hover{color:var(--p)}.btn{display:inline-flex;border:0;cursor:pointer;align-items:center;justify-content:center;padding:13px 18px;border-radius:14px;font-weight:800;background:linear-gradient(135deg,var(--p),#8b62ff);color:#fff;box-shadow:0 12px 25px #6c4cff2c}.btn.alt{background:#fff;color:var(--ink);box-shadow:none;border:1px solid #e5e8f1}.hero{max-width:1160px;margin:42px auto 20px;padding:0 20px}.heroBox{position:relative;overflow:hidden;border-radius:34px;padding:62px 48px;background:linear-gradient(120deg,#171d35 0%,#4030a6 55%,#ec4f9c 100%);color:#fff;box-shadow:var(--shadow)}.heroBox:after,.heroBox:before{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.35}.heroBox:before{width:300px;height:300px;background:#fff;right:-100px;top:-120px}.heroBox:after{width:220px;height:220px;background:#20e0bb;right:180px;bottom:-150px}.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:900;opacity:.85}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.96;margin:12px 0 18px;max-width:720px}.hero p{font-size:18px;line-height:1.6;max-width:650px;color:#eef0ff}.heroBtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.hero .btn.alt{background:#ffffff1c;color:#fff;border-color:#ffffff42}.section{max-width:1160px;margin:70px auto;padding:0 20px}.section h2{font-size:34px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid #eceef5;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(30,35,70,.05);transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.icon{font-size:34px;margin-bottom:16px}.card h3{margin:0 0 7px}.card p{color:var(--muted);font-size:14px;line-height:1.5}.feature{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.featureBox{border-radius:28px;padding:32px;background:#fff;border:1px solid #eceef5;box-shadow:var(--shadow)}.pill{display:inline-block;background:#f0edff;color:#5940d7;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}.steps{display:grid;gap:12px}.step{display:flex;gap:14px;align-items:flex-start}.num{min-width:34px;height:34px;border-radius:11px;background:#171d35;color:#fff;display:grid;place-items:center;font-weight:900}.footer{margin-top:80px;background:#12172a;color:#dfe3f1;padding:40px 20px}.footerIn{max-width:1160px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.formWrap{max-width:850px;margin:40px auto;padding:0 20px}.form{background:#fff;border:1px solid #eceef5;border-radius:28px;padding:28px;box-shadow:var(--shadow)}label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #dfe3ed;border-radius:12px;font:inherit;outline:none}textarea{min-height:130px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{display:flex;gap:10px;margin-top:8px}.choice label{flex:1;border:1px solid #e2e5ee;padding:13px;border-radius:13px;margin:0;cursor:pointer}.choice input{width:auto}.notice{padding:13px 15px;border-radius:14px;background:#f5f3ff;color:#4c3bb4;font-size:13px;margin-top:14px}.success{background:#eafff8;color:#13775f}.admin{max-width:1160px;margin:35px auto;padding:0 20px}.login{max-width:440px;margin:70px auto}.dash{display:none}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid #eceef5;border-radius:20px;padding:20px}.stat b{font-size:28px}.order{background:#fff;border:1px solid #e7e9f1;border-radius:20px;padding:20px;margin:14px 0}.orderHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eeeaff;color:#5a43ce}.small{font-size:13px;color:var(--muted)}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:800px){.links{display:none}.grid{grid-template-columns:1fr 1fr}.feature{grid-template-columns:1fr}.heroBox{padding:42px 26px}.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{margin-top:20px}.hero h1{font-size:48px}}
</style></head><body>
<nav class="nav"><div class="navin"><a class="brand" href="index.html"><span class="logo">B2</span>B2S Admin</a><a class="btn alt" href="index.html">View Store</a></div></nav>
<section class="admin"><div class="login" id="login"><div class="form"><span class="pill">SECURE ADMIN</span><h1>Admin Login</h1><p class="sub">Use the Supabase admin account you create in Authentication.</p><label>Email</label><input id="email" type="email" placeholder="Admin email"><label>Password</label><input id="password" type="password" placeholder="Admin password"><button class="btn" style="width:100%;margin-top:16px" onclick="login()">Login</button><div id="err" class="notice" style="display:none"></div></div></div>
<div class="dash" id="dash"><div class="topline"><div><span class="pill">B2S DASHBOARD</span><h1>Orders</h1></div><button class="btn alt" onclick="logout()">Logout</button></div><div class="stats"><div class="stat"><div class="small">Total Orders</div><b id="total">0</b></div><div class="stat"><div class="small">Pending</div><b id="pending">0</b></div><div class="stat"><div class="small">Delivery</div><b id="delivery">0</b></div></div><div id="orders"></div></div></section>
<script>
const sb=supabase.createClient(window.B2S_SUPABASE_URL,window.B2S_SUPABASE_KEY);
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){err.textContent=error.message;err.style.display="block"}else show()}
async function logout(){await sb.auth.signOut();location.reload()}
async function show(){login.style.display="none";dash.style.display="block";await render()}
async function render(){const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});if(error){alert(error.message);return}total.textContent=data.length;pending.textContent=data.filter(x=>x.status==="Pending").length;delivery.textContent=data.filter(x=>x.mode==="Delivery").length;orders.innerHTML=data.length?data.map(o=>`<div class="order"><div class="orderHead"><div><b>${esc(o.order_code)}</b><div class="small">${new Date(o.created_at).toLocaleString()}</div></div><span class="badge">${esc(o.status)}</span></div><p><b>${esc(o.name)}</b> • ${esc(o.phone)}<br><span class="small">${esc(o.mode)} • ${esc(o.payment)}</span></p><p><b>Requirements</b><br>${esc(o.items).replace(/\\n/g,"<br>")}</p>${o.address?`<p><b>Address</b><br>${esc(o.address)}</p>`:""}<div style="display:flex;gap:8px;flex-wrap:wrap"><select onchange="status('${o.id}',this.value)"><option ${o.status==="Pending"?"selected":""}>Pending</option><option ${o.status==="Confirmed"?"selected":""}>Confirmed</option><option ${o.status==="Ready"?"selected":""}>Ready</option><option ${o.status==="Delivered"?"selected":""}>Delivered</option><option ${o.status==="Rejected"?"selected":""}>Rejected</option></select><button class="btn alt" onclick="del('${o.id}')">Delete</button></div></div>`).join(""):'<div class="empty">No orders yet.</div>'}
async function status(id,v){const {error}=await sb.from("orders").update({status:v}).eq("id",id);if(error)alert(error.message);else render()}
async function del(id){if(confirm("Delete this order?")){const {error}=await sb.from("orders").delete().eq("id",id);if(error)alert(error.message);else render()}}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)show()})();
</script></body></html>
